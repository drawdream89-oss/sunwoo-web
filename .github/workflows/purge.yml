# main에 올리면 jsDelivr 캐시를 비워 몇 분 안에 사이트에 반영되게 함
name: purge-jsdelivr
on:
  push:
    branches: [main]
jobs:
  purge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 2 }
      - name: Purge changed files
        run: |
          files=$(git diff --name-only HEAD~1 HEAD 2>/dev/null || git ls-files)
          [ -z "$files" ] && files=$(git ls-files)
          for f in $files sw.css sw.js; do
            curl -s "https://purge.jsdelivr.net/gh/${{ github.repository }}@main/$f" > /dev/null && echo "purged $f"
          done
